# Deploys main to Cloudflare Workers. Off by default so forks don't try to deploy.
# To enable, set in the repo's Settings → Secrets and variables → Actions:
#   variables: CLOUDFLARE_DEPLOY=true, D1_DATABASE_ID=<from `npx wrangler d1 create venn`>,
#              CUSTOM_DOMAIN=<optional, e.g. venn.day; the domain must be a zone on the same Cloudflare account>
#              CLOUDFLARE_EMAIL=<optional, true to send notification emails with Cloudflare Email Sending;
#                               a secret works too>
#   secrets:   CLOUDFLARE_API_TOKEN (Workers + D1 edit), CLOUDFLARE_ACCOUNT_ID
#              VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY <optional: phone notifications; make them with `npm run vapid`>
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add protection rules to this environment (Settings → Environments) so only main can deploy.
    environment: Venn-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set D1 database id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml
      - name: Set custom domain
        if: vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$CUSTOM_DOMAIN" >> wrangler.toml
      - name: Send email with Cloudflare
        env:
          # Accepted as a variable or a secret, in any case, so a slip in the settings doesn't
          # silently leave email off.
          FROM_VAR: ${{ vars.CLOUDFLARE_EMAIL }}
          FROM_SECRET: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          flag=$(printf '%s' "${FROM_VAR:-$FROM_SECRET}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$flag" = "true" ]; then
            printf '\n[[send_email]]\nname = "EMAIL"\n' >> wrangler.toml
            echo "CLOUDFLARE_EMAIL is on: the Worker gets the EMAIL binding for Cloudflare Email Sending."
          elif [ -n "$FROM_VAR$FROM_SECRET" ]; then
            echo "::warning::CLOUDFLARE_EMAIL is set but isn't \"true\", so Cloudflare email stays off."
          else
            echo "CLOUDFLARE_EMAIL isn't set (as a variable or a secret), so Cloudflare email stays off."
          fi
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          # Forgive copy-paste slips (spaces, line breaks, a "Bearer " prefix), and say what's
          # wrong without ever printing the secrets.
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          token=${token#Bearer}
          account=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          if [ -z "$token" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it as a secret on the environment this job uses."
            exit 1
          fi
          if ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::CLOUDFLARE_API_TOKEN (${#token} characters) contains characters a token can't have, such as quotes, ':' or '/'. Paste only the token itself, not the curl command or anything around it."
            exit 1
          fi
          if ! printf '%s' "$account" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 characters of 0-9 and a-f; this one has ${#account}."
            exit 1
          fi
          echo "Token: ${#token} characters. Account ID: ok."
          CLOUDFLARE_API_TOKEN=$token CLOUDFLARE_ACCOUNT_ID=$account npx wrangler deploy
          # Phone notifications (docs/NOTIFICATIONS.md): the key pair, from the repository's secrets, onto
          # the Worker. Without both, they stay off.
          if [ -n "$VAPID_PUBLIC_KEY" ] && [ -n "$VAPID_PRIVATE_KEY" ]; then
            node -e 'process.stdout.write(JSON.stringify({ VAPID_PUBLIC_KEY: process.env.VAPID_PUBLIC_KEY.trim(), VAPID_PRIVATE_KEY: process.env.VAPID_PRIVATE_KEY.trim() }))' > "$RUNNER_TEMP/vapid.json"
            CLOUDFLARE_API_TOKEN=$token CLOUDFLARE_ACCOUNT_ID=$account npx wrangler secret bulk "$RUNNER_TEMP/vapid.json"
            rm -f "$RUNNER_TEMP/vapid.json"
            echo "Phone notifications: on."
          else
            echo "VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY aren't both set, so phone notifications stay off."
          fi
