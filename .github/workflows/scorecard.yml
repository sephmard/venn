name: Scorecard

# OpenSSF Scorecard: checks the project's security practices (pinned actions, branch protection,
# code review, …), publishes the score for the README badge and shows findings in the Security tab.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2' # weekly
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload results to the Security tab
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
