name: Dependabot auto-merge

# Patch and minor updates merge themselves once "CI passed" is green. Major updates, which may
# need code changes, wait for a human. Requires "Allow auto-merge" in the repository settings.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'sephmard/venn'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Turn on auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
