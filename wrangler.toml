name = "venn"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Files in public/ are served first. Paths with no file (the app's /new and /e/:id
# routes, and 404s) fall through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Optional features are configured with secrets, never in this file:
#   npx wrangler secret put RESEND_API_KEY   # email notifications (see docs/NOTIFICATIONS.md)
#   npx wrangler secret put EMAIL_FROM
#   npx wrangler secret put ANTHROPIC_API_KEY  # AI features (see docs/AI.md)
# Calendar client IDs are public and can go in [vars] (see docs/CALENDARS.md):
#   GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, MICROSOFT_TENANT

# Create the database once with:  npx wrangler d1 create venn
# then paste the database_id it prints below. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "venn"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Production runs on venn.day. The deploy workflow adds the domain from the CUSTOM_DOMAIN
# variable of the "production" GitHub environment, so forks never try to claim it. By hand:
# [[routes]]
# pattern = "venn.day"
# custom_domain = true

# Staging: a separate Worker and database, deployed from main to staging.venn.day.
#   npx wrangler d1 create venn-staging      (paste the id below)
#   npx wrangler deploy --env staging
# Secrets are per environment: npx wrangler secret put ANTHROPIC_API_KEY --env staging
[env.staging]
name = "venn-staging"

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first for every path so it can mark the whole site noindex.
run_worker_first = true

[env.staging.vars]
NOINDEX = "true"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "venn-staging"
database_id = "REPLACE_WITH_YOUR_STAGING_D1_DATABASE_ID"
