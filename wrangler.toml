name = "venn"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Files in public/ are served first. Paths with no file (the app's /new and /e/:id
# routes, and 404s) fall through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Optional features are configured with secrets, never in this file:
#   npx wrangler secret put RESEND_API_KEY   # email notifications (see docs/NOTIFICATIONS.md)
#   npx wrangler secret put EMAIL_FROM
# Calendar client IDs are public and can go in [vars] (see docs/CALENDARS.md):
#   GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, MICROSOFT_TENANT

# Create the database once with:  npx wrangler d1 create venn
# then paste the database_id it prints below. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "venn"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# The public site runs on venn.day. The deploy workflow adds the domain from the
# CUSTOM_DOMAIN repository variable, so forks never try to claim it. To do it by hand:
# [[routes]]
# pattern = "venn.day"
# custom_domain = true
