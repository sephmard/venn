name = "venn"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Create the database once with:  npx wrangler d1 create venn
# then paste the database_id it prints below. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "venn"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
