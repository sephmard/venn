name = "venn"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Files in public/ are served first. Paths with no file (the app's /new and /e/:id
# routes, and 404s) fall through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Every hour: reminders to invitees before a poll's deadline, and the organizer's "answers are in"
# email after it (src/deadline.js). Nothing is sent unless the server sends email.
[triggers]
crons = ["0 * * * *"]

# Optional features are configured with secrets, never in this file:
#   npx wrangler secret put EMAIL_FROM       # email notifications (see docs/NOTIFICATIONS.md),
#   npx wrangler secret put EMAIL_REPLY_TO   # optional: where replies to those emails go
#   npx wrangler secret put RESEND_API_KEY   # sent with Resend, or with Cloudflare Email Sending:
#     [[send_email]]                         # the deploy workflow adds this binding when the
#     name = "EMAIL"                         # CLOUDFLARE_EMAIL repository variable is true
#   npx wrangler secret put ANTHROPIC_API_KEY  # AI features (see docs/AI.md)
#   npx wrangler secret put GOOGLE_PLACES_API_KEY  # address search with Google (see docs/SELF-HOSTING.md)
# Calendar client IDs are public and can go in [vars] (see docs/CALENDARS.md):
#   GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, MICROSOFT_TENANT
# Optional sign-in and My polls (see docs/ACCOUNTS.md): the client ID above plus its secret.
#   npx wrangler secret put GOOGLE_CLIENT_SECRET      # Sign in with Google
#   npx wrangler secret put MICROSOFT_CLIENT_SECRET   # Sign in with Microsoft
#   GITHUB_CLIENT_ID in [vars], then: npx wrangler secret put GITHUB_CLIENT_SECRET
# Email and password sign-in is on whenever email is (EMAIL_SIGNIN = "off" turns it off).

# Workers Logs: console output (like why an AI request failed) is kept and searchable in the
# Cloudflare dashboard under Workers > venn > Logs.
[observability]
enabled = true

[vars]
# Address search in "Where" with OpenStreetMap's Photon: free and keyless. Remove it to switch the
# search off, or set it to "google" with the GOOGLE_PLACES_API_KEY secret.
PLACES_PROVIDER = "photon"

# Rate limits that hold across every copy of the Worker in a Cloudflare location (src/limits.js).
# Each is per visitor (IP address) per minute, checked on top of the per-copy limits in the code.
# The namespace_id only has to be unique within your Cloudflare account.
[[ratelimits]]
name = "AI_RATE_LIMITER"        # AI requests (docs/AI.md)
namespace_id = "72601"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMITER"      # email sign-in, sign-up and password tries
namespace_id = "72602"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"   # the contact form
namespace_id = "72603"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "PLACES_RATE_LIMITER"    # address search in "Where"
namespace_id = "72604"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CREATE_RATE_LIMITER"    # new polls and templates
namespace_id = "72605"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMITER"     # answers, Claude and other assistants (/api/mcp), results, usage counts
namespace_id = "72606"
simple = { limit = 300, period = 60 }

# Create the database once with:  npx wrangler d1 create venn
# then paste the database_id it prints below. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "venn"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# The public site runs on venn.day. The deploy workflow adds the domain from the
# CUSTOM_DOMAIN repository variable, so forks never try to claim it. To do it by hand:
# [[routes]]
# pattern = "venn.day"
# custom_domain = true
