<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Venn">
  <!-- Drawn on a 16 px grid so it stays sharp in browser tabs. Two colours keep the circles distinct. -->
  <rect width="16" height="16" rx="3.5" fill="#16181a"/>
  <defs><clipPath id="l"><circle cx="6" cy="8" r="4.5"/></clipPath></defs>
  <circle cx="6" cy="8" r="4.5" fill="#2fc497"/>
  <circle cx="10" cy="8" r="4.5" fill="#f2b13c"/>
  <circle cx="10" cy="8" r="4.5" fill="#faf8f4" clip-path="url(#l)"/>
</svg>
