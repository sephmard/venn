<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <!-- Polls are private to the people with the link: keep them out of search results. -->
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=6" />
    <!-- On an iPhone's Home Screen: Venn, full screen, with the retro look's dark status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Venn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Venn: find a time that works</title>
    <meta
      name="description"
      content="Free, no-signup scheduling poll. Share a link, everyone paints their availability, see the best time instantly."
    />
    <link rel="icon" href="/favicon.ico?v=5" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- The retro look (only under html.retro, which app-look.js or the server sets first). -->
    <link rel="stylesheet" href="/retro-app.css" />
    <script src="/app-look.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <img src="/favicon.svg?v=5" width="28" height="28" alt="" />
        Venn
      </a>
      <a href="/new" class="btn btn-new" data-link><span aria-hidden="true">+</span> Create a Venn</a>
    </header>
    <main id="app"></main>
    <footer class="footer">Free and open source. No ads, no tracking. <a href="/privacy">Privacy</a></footer>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
