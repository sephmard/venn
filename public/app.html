<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <!-- Polls are private to the people with the link: keep them out of search results. -->
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4" />
    <title>Venn: find a time that works</title>
    <meta
      name="description"
      content="Free, no-signup scheduling poll. Share a link, everyone paints their availability, see the best time instantly."
    />
    <link rel="icon" href="/favicon.ico?v=4" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <img src="/favicon.svg?v=4" width="28" height="28" alt="" />
        Venn
      </a>
      <a href="/new" class="btn btn-new" data-link aria-label="Create a new poll"
        ><span aria-hidden="true">+</span> <span class="long">Create a new poll</span
        ><span class="short" aria-hidden="true">New poll</span></a
      >
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer">Free and open source. No ads, no tracking. <a href="/privacy">Privacy</a></footer>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
