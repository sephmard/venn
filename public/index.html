<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Venn: find a time that works</title>
    <meta
      name="description"
      content="Free, no-signup scheduling poll. Share a link, everyone paints their availability, see the best time instantly."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand" data-link>
        <svg viewBox="0 0 120 80" width="36" height="24" aria-hidden="true">
          <defs>
            <clipPath id="brand-left"><circle cx="45" cy="40" r="30" /></clipPath>
          </defs>
          <circle cx="45" cy="40" r="30" fill="var(--accent)" fill-opacity=".28" />
          <circle cx="75" cy="40" r="30" fill="var(--accent)" fill-opacity=".28" />
          <circle cx="75" cy="40" r="30" fill="var(--accent)" clip-path="url(#brand-left)" />
        </svg>
        Venn
      </a>
      <a href="/" class="btn btn-ghost" data-link>New poll</a>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer">Free and open source. No accounts, no ads, no tracking.</footer>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
